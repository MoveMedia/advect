<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../src/advect.ts" type="module"></script>
  </head>
  <body>
    <my-component>
      <h2 slot="stuff">Some Content</h2>
    </my-component>

    <template advect="my-component" root="shadow" shadow="open">
      <settings>
        <data name="my-attr" type="string" set="attr"></data>
        <data name="myProp"  type="string" set="props"></data>
      </settings>
      <layout>
        <h1>Hello World</h1>
        <slot name="stuff">
          <h2>No content</h2>
        </slot>
      </layout>
      <script type="module">
        export default function ({ $, $el, $props, $refs, $attr, $internals }) {
          console.log($props)
        }
      </script>
    </template>
  </body>
</html>
