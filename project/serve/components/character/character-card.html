
<template advect="character-card" root="shadow">

  </datalist>
  <layout>

  <style>
    @property --sample-prop {
      syntax: "<color>";
      inherits: false;

    .char-card {
      border: 2px solid white;
      border-radius: 1em;
      width: fit-content;

      background:

            transparent,
            transparent
          )
          padding-box,
        /* Outer gradient background (the border itself) */
          linear-gradient(to right, darkblue, darkorchid) border-box;

      /* 4. Clip the backgrounds to their respective boxes */

      return {

          if ( name == 'name'){
            $refs.name.textContent = newVal;

          if ( name == 'image'){
